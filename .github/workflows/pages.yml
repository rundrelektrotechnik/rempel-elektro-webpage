# Publishes the site to GitHub Pages on every push to main.
#
# The project page lives under /rempel-elektro-webpage/, but the real build uses
# root-relative links ("/kontakt/") that only work at the domain root. So this
# deploys the offline preview (`npm run preview`): relative links, checked for
# broken ones. It leaves out sitemap, robots, manifest and the 404 page.
#
# Once the site has its own domain (Settings > Pages > Custom domain), deploy the
# real build instead: run `npm run build` and upload `_site` as the artifact.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _preview/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
